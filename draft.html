<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>팀 드래프트 — PAPS + 인성 AI 팀빌딩</title>
  <link rel="icon" type="image/png" href="assets/favicon-64.png">
  <link rel="stylesheet" href="css/draft.css?v=3">
</head>
<body class="draft">
  <header class="dbar">
    <div class="dbar-left">
      <a href="index.html" class="back" title="메인 화면으로">← 메인</a>
      <span class="logo-chip" title="프로젝트 아고라 · AI융합교육 교사연구회"><img src="assets/logo-full.png" alt="프로젝트 아고라"></span>
      <h1>팀 드래프트</h1>
      <span id="d-mode" class="pill"></span>
      <span id="d-class" class="pill soft"></span>
    </div>
    <div class="dbar-right" id="d-controls" hidden>
      <label class="switch" id="d-reveal-wrap" title="익명 드래프트 중 이름을 보여 줍니다 (교사용)" hidden><input type="checkbox" id="d-reveal"><span>이름 공개</span></label>
      <label class="switch" title="개인 점수(PAPS 총점·덕목 수치)를 화면에 표시합니다. 학생과 함께 볼 때는 끄는 것을 권장합니다."><input type="checkbox" id="d-detail"><span>상세 점수</span></label>
      <button id="d-auto" class="btn" type="button" title="현재 팀을 위해 균형에 맞는 선수를 자동으로 고릅니다">자동 지명</button>
      <button id="d-undo" class="btn ghost" type="button">되돌리기</button>
      <button id="d-restart" class="btn ghost danger" type="button">처음부터</button>
      <button id="d-finish" class="btn primary" type="button">완료 · 저장</button>
    </div>
  </header>

  <main id="d-main">
    <!-- 준비 화면 -->
    <section id="d-setup" class="setup">
      <div class="setup-card">
        <h2>드래프트 준비</h2>
        <p class="lead" id="d-setup-info"></p>
        <div class="mode-grid" id="d-mode-grid">
          <button class="mode-card" data-mode="auto" type="button">
            <span class="mode-icon">🧑‍🏫</span>
            <b>교사 편성 공개</b>
            <small>앱이 균형 있게 짠 팀을 라운드마다 한 명씩 드래프트처럼 공개합니다.</small>
          </button>
          <button class="mode-card" data-mode="pick" type="button">
            <span class="mode-icon">🎯</span>
            <b>팀별 드래프트</b>
            <small>체력이 비슷한 선수들 풀에서 팀이 뱀 순서로 직접 지명합니다. 성실·협동·정의·배려 성향을 보고 고릅니다.</small>
          </button>
          <button class="mode-card" data-mode="credit" type="button">
            <span class="mode-icon">💎</span>
            <b>크레딧 드래프트</b>
            <small>선수마다 1~10 크레딧. 팀 예산 안에서 고르고, 예산 합계는 전체 크레딧과 같습니다.</small>
          </button>
        </div>
        <div class="setup-row">
          <label>팀 수 <input type="number" id="d-teamCount" min="2" max="12" step="1"></label>
          <label class="check"><input type="checkbox" id="d-gender"> 성별 균형</label>
          <label class="check" id="d-anon-wrap" title="드래프트 중에는 이름·번호 대신 무작위 코드(선수 07)로 보이고, 완료 후 이름을 공개합니다"><input type="checkbox" id="d-anon"> 익명 드래프트</label>
          <label id="d-weight-wrap">크레딧 체력 비중 <input type="range" id="d-weight" min="0" max="1" step="0.1"> <b id="d-weight-val"></b></label>
          <label class="check"><input type="checkbox" id="d-timer"> 지명 시간 제한 <input type="number" id="d-timer-sec" min="10" max="180" step="5" value="30" style="width:4.5em"> 초</label>
        </div>
        <div class="names" id="d-names"></div>
        <div class="setup-actions">
          <button id="d-lottery" class="btn" type="button">🎲 지명 순서 추첨</button>
          <div id="d-order" class="order"></div>
          <button id="d-start" class="btn primary big" type="button">드래프트 시작 ▶</button>
        </div>
        <p class="hint" id="d-setup-warn"></p>
      </div>
    </section>

    <!-- 진행 화면 -->
    <section id="d-stage" class="stage" hidden>
      <div class="stage-head">
        <div class="round" id="d-round"></div>
        <div class="now" id="d-now"></div>
        <div class="timer" id="d-timer-view" hidden><span id="d-timer-num"></span></div>
        <div class="progress"><i id="d-progress-bar"></i></div>
      </div>
      <div class="pool" id="d-pool"></div>
    </section>

    <section id="d-boards" class="boards" hidden></section>
  </main>

  <div id="d-toast" class="toast" hidden></div>
  <div id="d-confetti" class="confetti" hidden></div>

  <script src="js/questions.js?v=4"></script>
  <script src="js/paps_table.js?v=4"></script>
  <script src="js/scoring.js?v=4"></script>
  <script src="js/algorithm.js?v=4"></script>
  <script src="js/state.js?v=4"></script>
  <script src="js/draft_logic.js?v=2"></script>
  <script src="js/draft_ui.js?v=2"></script>
</body>
</html>
